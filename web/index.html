<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <a href="#/" style="text-decoration:none"><h1 class="logo">Flow</h1></a>
      <div class="header-actions">
        <button id="btn-new" class="btn-new">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>
        <div id="new-dropdown" class="new-dropdown" hidden>
          <button id="new-project-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            Project
          </button>
          <button id="new-task-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            Task
          </button>
        </div>
      </div>
    </header>

    <nav id="filter-bar" class="filter-bar">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="signal">Signal</button>
      <button class="filter-tab" data-filter="noise">Noise</button>
    </nav>

    <main id="main-content"></main>

    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="modal-close">&times;</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="store.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
